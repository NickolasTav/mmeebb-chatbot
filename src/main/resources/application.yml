spring:
  application:
    name: med-mmeebb-chatbot

  config:
    import: optional:file:.env[.properties]

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mmeebb_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    br.edu.unipam.tcc: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %clr(%5p) [%X{traceId:-},%X{studentPhone:-},%X{action:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %5p [%X{traceId:-},%X{studentPhone:-},%X{action:-}] %logger{36} - %msg%n"
  file:
    name: logs/application.log

uazapi:
  base-url: ${UAZAPI_BASE_URL:https://free.uazapi.com}
  api-key: ${UAZAPI_API_KEY:}
  instance: ${UAZAPI_INSTANCE:}
  admin-token: ${UAZAPI_ADMIN_TOKEN:}
  typing-delay-ms: ${UAZAPI_TYPING_DELAY_MS:2000}
  inbound:
    concurrency: ${UAZAPI_INBOUND_CONCURRENCY:3-6}

ngrok:
  client-api-url: ${NGROK_CLIENT_API_URL:http://127.0.0.1:4040}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL_NAME:gemini-3.5-flash-lite}
  embedding-model-name: ${GEMINI_EMBEDDING_MODEL_NAME:gemini-embedding-001}
  temperature: ${GEMINI_TEMPERATURE:0.2}

admin:
  api-key: ${ADMIN_API_KEY:teste}

mmeebb:
  session:
    ttl-minutes: ${MMEEBB_SESSION_TTL_MINUTES:60}
  scheduler:
    cron: ${MMEEBB_SCHEDULER_CRON:0 */5 * * * *}
  adaptive:
    # Desligar devolve o sistema ao MMEEBB classico (sem teto, reforco ou repriorizacao).
    enabled: ${MMEEBB_ADAPTIVE_ENABLED:true}
    # Janela de analise do desempenho, em dias: um mes ruim nao marca o topico para sempre.
    window-days: ${MMEEBB_ADAPTIVE_WINDOW_DAYS:90}
    # Tentativas minimas no topico antes de personalizar qualquer coisa.
    min-attempts: ${MMEEBB_ADAPTIVE_MIN_ATTEMPTS:3}
    # Taxa de erro que classifica o topico como fragil (teto 2^3 = 8 dias).
    fragile-error-rate: ${MMEEBB_ADAPTIVE_FRAGILE_ERROR_RATE:0.50}
    # Taxa de erro que classifica o topico como em consolidacao (teto 2^6 = 64 dias).
    consolidating-error-rate: ${MMEEBB_ADAPTIVE_CONSOLIDATING_ERROR_RATE:0.20}
    # Cartoes do mesmo topico antecipados como reforco apos erro em topico fragil.
    reinforcement-max-cards: ${MMEEBB_ADAPTIVE_REINFORCEMENT_MAX_CARDS:2}
    # Tentativas minimas antes de exibir percentuais no relatorio de desempenho.
    report-min-attempts: ${MMEEBB_ADAPTIVE_REPORT_MIN_ATTEMPTS:5}



