spring:
  application:
    name: med-mmeebb-chatbot

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mmeebb_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    br.edu.unipam.tcc: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

uazapi:
  base-url: ${UAZAPI_BASE_URL:https://free.uazapi.com}
  api-key: ${UAZAPI_API_KEY:}
  instance: ${UAZAPI_INSTANCE:}
  typing-delay-ms: ${UAZAPI_TYPING_DELAY_MS:2000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL_NAME:gemini-1.5-flash}
  temperature: ${GEMINI_TEMPERATURE:0.2}

admin:
  api-key: ${ADMIN_API_KEY:}



